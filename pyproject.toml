[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Small, dependency-light LLM eval toolkit: JSONL results contract, honest error bars, checklist judges with calibration, and a CI gate."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richard K." }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
azure = [
    "azure-identity>=1.25.3",
    "openai>=2.0",
]
inspect = [
    "inspect-ai==0.3.271",
]

[project.scripts]
llm-eval = "llm_eval_harness.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4", "RET", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
